name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
env:
  DOTNET_VERSION: '10.x'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: ./LocalShare/ClientApp/pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        working-directory: ./LocalShare/ClientApp
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: ./LocalShare/ClientApp
        run: pnpm exec playwright install --with-deps

      # - name: Install SSL Certificates
      #   run: dotnet dev-certs https --trust

      - name: Publish .NET app
        working-directory: ./LocalShare
        run: dotnet publish -c Release -o ./bin/Release
      
      - name: Start .NET app
        working-directory: ./LocalShare
        run: dotnet ./bin/Release/LocalShare.dll --urls "http://localhost:5001" &

      - name: Run Playwright tests
        working-directory: ./LocalShare/ClientApp
        run: pnpm test-prod

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ./LocalShare/ClientApp/playwright-report/
          retention-days: 30
